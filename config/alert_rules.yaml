# Declarative lab rules; Slack delivery is not provisioned.
evaluation_interval: 30s
window: 5m
alerts:
- name: HighLatencyP95
  severity: warning
  condition: count(response_sent, 5m) >= 10 and p95(response_sent.latency_ms, 5m)
    > 3000
  duration: 5m
  type: symptom-based
  channel: slack
  slack_channel: '#k4-l3b-alerts'
  owner: student-2A202602569
  runbook: docs/alerts.md#alert-1
- name: HighRequestErrorRate
  severity: critical
  condition: count(request_received, 5m) >= 10 and 100 * count(request_failed, 5m)
    / count(request_received, 5m) > 2
  duration: 3m
  type: symptom-based
  channel: slack
  slack_channel: '#k4-l3b-alerts'
  owner: student-2A202602569
  runbook: docs/alerts.md#alert-2
- name: LowRetrievalSuccess
  severity: warning
  condition: count(tool_success != null, 5m) >= 10 and 100 * count(tool_success ==
    true, 5m) / count(tool_success != null, 5m) < 90
  duration: 5m
  type: symptom-based
  channel: slack
  slack_channel: '#k4-l3b-alerts'
  owner: student-2A202602569
  runbook: docs/alerts.md#alert-3
